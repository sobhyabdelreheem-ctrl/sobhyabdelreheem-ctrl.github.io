
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet Monitor</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f4f4f4;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
<main>
  <h2>Wallet Monitor</h2>
  <p>Pi Testnet SDK Connection Test</p>
  <p id="status">Pi SDK detected.</p>
  <button id="login">Sign in with Pi</button>
  <p id="result"></p>
  <button id="checkBalance">اختبار قراءة رصيد Mainnet</button>
<p id="balanceResult"></p>
</main>

  <script>
  const status = document.getElementById("status");
  const loginButton = document.getElementById("login");
  const result = document.getElementById("result");

  try {
    Pi.init({
      version: "2.0",
      sandbox: true
    });

    status.textContent = "Pi SDK initialized successfully.";

    loginButton.addEventListener("click", async function () {
      result.textContent = "Signing in...";

      try {
        const auth = await Pi.authenticate(
          ["username"],
          function (payment) {
            console.log("Incomplete payment:", payment);
          }
        );

        result.textContent =
          "Welcome, " + auth.user.username;
      } catch (error) {
        result.textContent =
          "Sign in failed: " + error.message;
      }
    });

  } catch (error) {
    status.textContent = "SDK initialization error.";
  }
    document.getElementById("checkBalance").addEventListener("click", async function () {
  const result = document.getElementById("balanceResult");
  result.textContent = "جارٍ الاتصال بشبكة Mainnet...";

  const balanceId = "00000000ab80ac73f8537778eeed00ee39159cf73f7cd26cf81136f7efc9974ad815b942";

  try {
    const response = await fetch(
      "https://api.mainnet.minepi.com/claimable_balances/" + balanceId
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    result.textContent =
      "تم الاتصال بنجاح. الرصيد: " + data.amount + " Pi";
  } catch (error) {
    result.textContent = "تعذر الاتصال: " + error.message;
  }
});
</script>
</body>
</html>
