
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet Monitor</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f4f4f4;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 12px;
      max-width: 600px;
      margin: auto;
    }
    button {
      padding: 12px;
      margin: 10px;
      font-size: 17px;
    }
    #balanceResult {
      white-space: pre-line;
      font-size: 18px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h2>Wallet Monitor</h2>
  <p>Pi Mainnet Balance Monitor</p>
  <p id="status">جاري تهيئة Pi SDK...</p>

  <button id="login">Sign in with Pi</button>
  <p id="result"></p>

  <button id="checkBalance">فحص الرصيد الآن</button>
  <p id="balanceResult">في انتظار الفحص...</p>
</main>

<script>
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const balanceResult = document.getElementById("balanceResult");

  try {
    Pi.init({
      version: "2.0",
      sandbox: true
    });
    status.textContent = "Pi SDK initialized successfully.";
  } catch (error) {
    status.textContent = "SDK initialization error: " + error.message;
  }

  document.getElementById("login").addEventListener("click", async function () {
    result.textContent = "Signing in...";
    try {
      const auth = await Pi.authenticate(
        ["username"],
        function (payment) {
          console.log("Incomplete payment:", payment);
        }
      );
      result.textContent = "Welcome, " + auth.user.username;
    } catch (error) {
      result.textContent = "Sign in failed: " + error.message;
    }
  });

  const balanceId =
    "00000000ab80ac73f8537778eeed00ee39159cf73f7cd26cf81136f7efc9974ad815b942";

  const oldWallet =
    "GDTNZX26BAROLSLYPMR6ROWJE362IAIIRBCFXHJQLIPSAPV4BPZQL4JD";

let checking = false;
let checkCount = 0;
  async function checkBalance() {
    if (checking) return;
    checking = true;

    try {
      const response = await fetch(
        "https://api.mainnet.minepi.com/claimable_balances/" + balanceId
      );

      if (response.status === 404) {
        balanceResult.textContent =
          "الرصيد غير موجود حاليًا أو تمت المطالبة به.";
        return;
      }

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();
        checkCount++;

      const claimant = data.claimants.find(
        item => item.destination === oldWallet
      );

      if (!claimant) {
        balanceResult.textContent = "المستفيد غير موجود.";
        return;
      }

      const unlockDate =
        claimant.predicate?.not?.abs_before;

      if (!unlockDate) {
        balanceResult.textContent = "تعذر قراءة موعد فك القفل.";
        return;
      }

      const unlocked =
        Date.now() >= new Date(unlockDate).getTime();

      balanceResult.textContent ="عدد مرات الفحص: " + checkCount +
        "آخر فحص: " + new Date().toLocaleTimeString("ar-EG") +
        "\nالرصيد: " + data.amount + " Pi" +
        "\nالحالة: " +
        (unlocked ? "تحقق الشرط الزمني للمطالبة" : "ما زال مقفلاً") +
        "\nموعد فك القفل: " +
        new Date(unlockDate).toLocaleString("ar-EG") +
        "\nالفحص التالي بعد 15 ثانية.";

    } catch (error) {
      balanceResult.textContent =
        "تعذر تحديث البيانات: " + error.message;
    } finally {
      checking = false;
    }
  }

  document.getElementById("checkBalance").addEventListener(
    "click", checkBalance
  );

  checkBalance();
  setInterval(checkBalance, 15000);
</script>
</body>
</html>
